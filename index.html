<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орёл или решка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #14213d;
    --ink: #fdf6e3;
    --gold: #e9b44c;
    --gold-dark: #a8741a;
    --muted: #8f9bb8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .scene { perspective: 900px; width: 200px; height: 200px; }
  .coin {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 1.6s cubic-bezier(.2,.7,.2,1);
  }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #f7d58a, var(--gold) 55%, var(--gold-dark));
    border: 8px solid #c58b27;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 14px 30px rgba(0,0,0,.45);
    color: #5a3b05; text-align: center;
  }
  .face .sym { font-size: 76px; line-height: 1; }
  .face .txt { font-size: 22px; font-weight: bold; margin-top: 6px; }
  .tails { transform: rotateY(180deg); }
  #result { font-size: 30px; min-height: 40px; }
  button {
    font: inherit; font-size: 20px; font-weight: bold;
    background: var(--gold); color: #3a2603;
    border: 0; border-radius: 14px; padding: 16px 44px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #stats { color: var(--muted); font-size: 16px; }
  @media (prefers-reduced-motion: reduce) { .coin { transition-duration: .01s; } }
</style>
</head>
<body>
  <div class="scene">
    <div class="coin" id="coin">
      <div class="face heads"><div class="sym">🦅</div><div class="txt">Орёл</div></div>
      <div class="face tails"><div class="sym">💰</div><div class="txt">Решка</div></div>
    </div>
  </div>
  <div id="result" aria-live="polite">Бросай монетку</div>
  <button id="btn">Подбросить</button>
  <div id="stats">Орёл: 0 · Решка: 0</div>

<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const coin = document.getElementById('coin');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const stats = document.getElementById('stats');
  let rotation = 0, heads = 0, tails = 0;

  // Честный 50/50: криптографически случайный бит
  function flipBit() {
    const a = new Uint8Array(1);
    crypto.getRandomValues(a);
    return a[0] & 1;
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    result.textContent = '…';
    const isHeads = flipBit() === 0;
    // несколько полных оборотов + нужная сторона
    const turns = 5 + Math.floor(Math.random() * 3);
    const current = ((rotation % 360) + 360) % 360;
    const target = isHeads ? 0 : 180;
    rotation += turns * 360 + ((target - current + 360) % 360);
    coin.style.transform = 'rotateY(' + rotation + 'deg)';
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    setTimeout(() => {
      if (isHeads) heads++; else tails++;
      result.textContent = isHeads ? 'Орёл!' : 'Решка!';
      stats.textContent = 'Орёл: ' + heads + ' · Решка: ' + tails;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      btn.disabled = false;
    }, 1700);
  });
</script>
</body>
</html>
